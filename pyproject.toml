[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s-q-ali-media-downloader"
version = "2.9.0"
description = "AI-powered bulk video downloader for TikTok, YouTube, Instagram & Facebook with neon theme and cross-platform social discovery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "S-Q-Ali" }]
keywords = ["tiktok", "youtube", "downloader", "yt-dlp", "pyside6"]
dependencies = [
    # PySide6 6.12 aborts during teardown in some conditions (a native access
    # violation that takes the whole test run with it). Stay on the verified
    # 6.11.x line until that is fixed upstream.
    "PySide6>=6.11,<6.12",
    "yt-dlp>=2026.8.19",
    # 0.16 and newer break yt-dlp's request-handler registration, which
    # silently disables the TLS impersonation the TikTok fetches need.
    "curl_cffi>=0.15,<0.16",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
    # PYSEC-2026-4320: the emSign ECC root was revoked (compromised keys).
    "certifi>=2026.10.19",
    # Instagram profile expansion. yt-dlp's own instagram:user extractor is
    # broken upstream (yt-dlp issue #4394), so instaloader lists the profile.
    "instaloader>=4.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.6",
    "pyinstaller>=6.10",
    "setuptools>=84.1.0",
]
# The Social Discovery feature drives a real browser. Without it the feature
# explains what to install; the rest of the app does not need it.
social = [
    "playwright>=1.44",
]
# The optional AI-agent browser. It reads the pages the deterministic
# renderer cannot, using the same Groq/Gemini keys as the judge.
agent = [
    "browser-use>=0.13.14,<0.14",
]

[project.urls]
Homepage = "https://github.com/S-Q-Ali/S-Q-Creator-Studio"

[project.scripts]
s-q-ali-media-downloader = "s_q_ali_media_downloader.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
s_q_ali_media_downloader = ["resources/*.ico"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Broad exceptions are intentional in the download engine: yt-dlp raises a
# wide, poorly-documented set of error types that all funnel into tidy_error().
# Silent exception in orchestrator destructor is acceptable — we're shutting down.
ignore = ["BLE001", "S110"]

[tool.pytest.ini_options]
addopts = "-q -p no:unraisableexception"
pythonpath = ["src"]
markers = [
    "live: hits real social media sites; CI runs pytest with -m 'not live'",
]
