[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s-q-ali-media-downloader"
version = "2.4.2"
description = "Bulk-download TikTok and YouTube videos with a queue-based desktop app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "S-Q-Ali" }]
keywords = ["tiktok", "youtube", "downloader", "yt-dlp", "pyside6"]
dependencies = [
    "PySide6>=6.5",
    "yt-dlp>=2026.8.19",
    "curl_cffi>=0.15.0,<0.18",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
    # PYSEC-2026-4320: the emSign ECC root was revoked (compromised keys).
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6.10",
]

[project.urls]
Homepage = "https://github.com/S-Q-Ali/Bulk-Video-Downloader"

[project.scripts]
s-q-ali-media-downloader = "s_q_ali_media_downloader.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
s_q_ali_media_downloader = ["resources/*.ico"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Broad exceptions are intentional in the download engine: yt-dlp raises a
# wide, poorly-documented set of error types that all funnel into tidy_error().
ignore = ["BLE001"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
