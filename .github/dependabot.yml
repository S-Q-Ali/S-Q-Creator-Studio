# Keep the dependencies honest.
#
# The certifi advisory (PYSEC-2026-4320, a revoked CA root) was found by
# running pip-audit by hand - a machine does it on every push instead.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # 0.16 and newer break yt-dlp's request handler, which silently
      # disables the TLS impersonation the TikTok fetches need - the app
      # downloads nothing and says nothing about why.
      - dependency-name: "curl_cffi"
      # 6.12 aborts during teardown in some conditions.
      - dependency-name: "PySide6"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
