name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Test (offscreen GUI)
        env:
          QT_QPA_PLATFORM: offscreen
          # A crash on the way out leaves no trace without this: the run
          # would end with every test passed and a failure code.
          PYTHONFAULTHANDLER: '1'
        run: pytest

      - name: Audit dependencies (OSV/pip-audit)
        run: python -m pip_audit

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name "S-Q Creator Studio" `
            --icon "src\s_q_ali_media_downloader\resources\icon.ico" `
            --add-data "src\s_q_ali_media_downloader\resources\icon.ico;." `
            --paths "src" --workpath "build\ci" --distpath "dist" `
            "src\s_q_ali_media_downloader\__main__.py"
          Write-Output ("EXE size MB: {0:N1}" -f ((Get-Item "dist\S-Q Creator Studio\S-Q Creator Studio.exe").Length / 1MB))

      - name: Smoke test the built EXE
        shell: pwsh
        run: |
          $exe = "dist\S-Q Creator Studio\S-Q Creator Studio.exe"
          if (-not (Test-Path $exe)) { throw "EXE not found: $exe" }
          $proc = Start-Process $exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 12
          if ($proc.HasExited) { throw "App exited early with code $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force
          Write-Output "App stayed alive for 12 seconds"

      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: portable-build
          path: dist\S-Q Creator Studio
