name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  QT_QPA_PLATFORM: offscreen
  # A crash on the way out leaves no trace without this: the run would end
  # with every test passed and a failure code.
  PYTHONFAULTHANDLER: '1'

jobs:
  pick:
    # A pull request runs two OSes at the release Python; a push to master
    # runs the whole matrix - three OSes by two Pythons on every proposed
    # change is a queue nobody waits for.
    #
    # The images are the floors the wheel spike found (tasks/plan-cross-platform.md,
    # B1): PySide6 6.11 has no wheel for a glibc older than 2.34 on x86_64 or
    # 2.39 on arm64, and none for a macOS older than 13. ubuntu-24.04 is glibc
    # 2.39, macos-14 is arm64 on macOS 14.
    #
    # macos-15-intel is the Intel half: an Apple Silicon build does not run on
    # an Intel Mac, and Rosetta 2 translates x86 to arm and not the other way
    # round. It is also GitHub's last x86_64 macOS image - it retires in
    # Fall 2027, and an Intel build after that needs a self-hosted runner.
    name: Choose the matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.choose.outputs.matrix }}
    steps:
      - name: Choose
        id: choose
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo 'matrix=[{"os":"ubuntu-24.04","python":"3.14"},{"os":"windows-latest","python":"3.14"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"os":"ubuntu-24.04","python":"3.12"},{"os":"ubuntu-24.04","python":"3.14"},{"os":"macos-14","python":"3.12"},{"os":"macos-14","python":"3.14"},{"os":"macos-15-intel","python":"3.12"},{"os":"macos-15-intel","python":"3.14"},{"os":"windows-latest","python":"3.12"},{"os":"windows-latest","python":"3.14"}]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: pick
    runs-on: ${{ matrix.os }}
    strategy:
      # One OS failing must not cancel the other two: the point of the matrix
      # is to see all three results.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.pick.outputs.matrix) }}
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the Qt runtime libraries
        if: runner.os == 'Linux'
        # The offscreen platform still loads Qt's own GUI stack, and a runner
        # image does not carry it: without these the first QApplication import
        # fails and every GUI test errors out before it starts.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-0 libegl1 libgl1 libglib2.0-0 libdbus-1-3

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Test (offscreen GUI)
        # The live tests open real Instagram/TikTok pages. GitHub's runners
        # get a login wall or an HTTP error from those sites, so the tests
        # cannot be deterministic here. Run them locally with `pytest -m live`.
        run: pytest -m "not live"

      - name: Audit dependencies (OSV/pip-audit)
        if: matrix.python == '3.14'
        # Audit the app's own runtime requirements. browser-use (the optional
        # agent extra) exact-pins its whole dependency set, including anyio,
        # mcp, pillow and pypdf; an environment-wide audit would report
        # advisories in those upstream pins even though the agent never
        # reaches their PDF, image or MCP paths. The core runtime stays
        # audited, and requirements-dev.txt records the pin.
        #
        # Once per OS, not once per Python: `keyring` is pulled in only off
        # Windows, so the requirement set the audit sees differs by OS.
        run: python -m pip_audit -r requirements.txt

      - name: Install ffmpeg and the browser (Windows)
        if: runner.os == 'Windows' && matrix.python == '3.14'
        shell: pwsh
        # The installer bundles both. windows-latest has Inno Setup, but not
        # the Playwright browser or ffmpeg, so the installer would fail on
        # its [Files] entries without them.
        run: |
          choco install innosetup ffmpeg --yes --no-progress
          Write-Output "ISCC: $((Get-ChildItem 'C:\Program Files*\Inno Setup 6\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName)"
          Write-Output "ffmpeg: $((Get-Command ffmpeg -ErrorAction SilentlyContinue).Source)"

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux' && matrix.python == '3.14'
        # "Best available" downloads video and audio as separate streams, and
        # yt-dlp needs ffmpeg to merge them; the portable folder carries it.
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS' && matrix.python == '3.14'
        run: brew install ffmpeg

      - name: Install the browser the app ships
        if: matrix.python == '3.14'
        # Social Discovery drives a real browser and the bundle carries one,
        # so the build stages whatever Chromium this runner has downloaded.
        # The full build, not the headless shell: the app asks Playwright for
        # channel="chromium".
        run: python -m playwright install chromium

      - name: Build the portable app
        if: matrix.python == '3.14'
        # The same script the release workflow runs, on all three OSes; the
        # Windows installer is compiled by it only where Inno Setup exists.
        run: python release/build.py

      - name: Smoke test the built app
        if: matrix.python == '3.14'
        shell: pwsh
        run: |
          # The launcher is wherever this OS's bundle puts it - the same three
          # answers release/build.py gives.
          $candidates = @(
            "release/portable/S-Q Creator Studio.app/Contents/MacOS/S-Q Creator Studio",
            "release/portable/S-Q Creator Studio.exe",
            "release/portable/S-Q Creator Studio"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "the portable build has no launcher" }
          # -WindowStyle exists only in the Windows edition of PowerShell; on
          # Linux and macOS it fails the call before the app can even start.
          $launch = @{ FilePath = $exe; PassThru = $true }
          if ($IsWindows) { $launch.WindowStyle = 'Hidden' }
          $proc = Start-Process @launch
          Start-Sleep -Seconds 30
          if ($proc.HasExited) { throw "App exited early with code $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force
          Write-Output "$exe stayed alive for 30 seconds"

      - name: Upload portable build
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: portable-build-${{ runner.os }}
          # release/portable is the complete build: the PyInstaller output
          # plus the shipped browser and the ffmpeg in its bin folder.
          # build/out alone is only the app and would not run Social
          # Discovery or merge video.
          path: release/portable
          if-no-files-found: error
